<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - TestPortal</title>
  <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>

  <div class="login-container">
    <form id="signupForm" novalidate>
      <h2>Create Account</h2>
      <p class="subtitle">Join the portal as a student or administrator</p>

      <!-- Alert Notification Banner -->
      <div id="signupAlert" class="login-alert" role="alert">
        <span id="alertIcon">⚠️</span>
        <span id="alertMessage"></span>
      </div>

      <!-- Full Name -->
      <div class="form-group">
        <label for="name">Full Name</label>
        <input 
          type="text" 
          id="name" 
          name="name" 
          placeholder="e.g. Jane Doe" 
          autocomplete="name"
          required 
        />
        <span id="nameError" class="field-error"></span>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          placeholder="e.g. jane@test.com" 
          autocomplete="email"
          required 
        />
        <span id="emailError" class="field-error"></span>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password (min. 6 characters)</label>
        <div class="password-wrapper">
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Create a strong password" 
            autocomplete="new-password"
            required 
          />
          <button type="button" id="togglePasswordBtn" class="toggle-password-btn" aria-label="Toggle password visibility">
            👁️
          </button>
        </div>
        <span id="passwordError" class="field-error"></span>
      </div>

      <!-- Role Selection -->
      <div class="form-group">
        <label for="role">Account Role</label>
        <select id="role" name="role" required>
          <option value="">-- Choose Account Role --</option>
          <option value="student">🎓 Student</option>
          <option value="admin">👤 Administrator / Instructor</option>
        </select>
        <span id="roleError" class="field-error"></span>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn">
        <span class="spinner" id="btnSpinner" style="display: none;"></span>
        <span id="btnText">Create Account</span>
      </button>

      <p class="login-link">
        Already have an account? <a href="/login">Log in here</a>
      </p>
    </form>
  </div>

  <script src="/static/js/signup.js"></script>
</body>
</html>
