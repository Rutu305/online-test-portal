<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard - TestPortal</title>
  <link rel="stylesheet" href="/static/css/admin.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    .admin-quick-actions {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
      flex-wrap: wrap;
      padding: 0 20px;
    }
    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 24px;
      background: #4F46E5;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      transition: background 0.2s, transform 0.2s;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }
    .action-btn:hover {
      background: #4338CA;
      transform: translateY(-2px);
    }
    .action-btn.secondary {
      background: #0ea5e9;
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
    }
    .action-btn.secondary:hover {
      background: #0284c7;
    }
  </style>
</head>
<body>
  <!-- Hamburger Menu -->
  <div class="hamburger" id="hamburger">&#9776;</div>

  <!-- Sidebar -->
  <aside class="sidebar hide" id="sidebar">
    <div style="margin-top: 40px;"></div>
    <div class="profile">
      <img src="https://i.pravatar.cc/100?img=12" alt="Admin Avatar" />
      <div class="profile-info">
        <strong id="admin-name">{{ session.get('name', 'Admin') }}</strong>
        <small id="admin-email">{{ session.get('email', 'admin@test.com') }}</small>
      </div>
    </div>

    <nav class="nav-links">
      <a href="/admin" id="dashboardBtn"><i class="fas fa-home"></i> Dashboard</a>
      <a href="/test-form" id="createTestBtn"><i class="fas fa-plus-circle"></i> Create Test</a>
      <a href="/all-tests" id="allTestsBtn"><i class="fas fa-book"></i> All Tests</a>
      <a href="/logout" id="signOutBtn"><i class="fas fa-sign-out-alt"></i> Sign Out</a>
    </nav>
  </aside>

  <!-- Main Content -->
  <h1>Admin Panel</h1>
  <p style="text-align: center; color: #555; margin-top: 5px;">Manage online tests, students, and evaluation results</p>

  <section class="dashboard-counters">
    <div class="counter-card">
      <h2 id="testCount">0</h2>
      <p>Total Tests</p>
    </div>
    <div class="counter-card">
      <h2 id="studentCount">0</h2>
      <p>Total Students</p>
    </div>
    <div class="counter-card">
      <h2 id="submissionCount">0</h2>
      <p>Total Submissions</p>
    </div>
  </section>

  <div class="admin-quick-actions">
    <a href="/test-form" class="action-btn">
      <i class="fas fa-plus-circle"></i> Create New Test
    </a>
    <a href="/all-tests" class="action-btn secondary">
      <i class="fas fa-users"></i> View All Tests & Submissions
    </a>
  </div>

  <script src="/static/js/admin.js"></script>
  <script>
    document.getElementById("hamburger").addEventListener("click", () => {
      document.getElementById("sidebar").classList.toggle("hide");
    });
  </script>
</body>
</html>
